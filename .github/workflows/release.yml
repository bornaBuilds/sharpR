name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.platform }}${{ matrix.args }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: " --target aarch64-apple-darwin"
            rust-targets: aarch64-apple-darwin
          - platform: macos-latest
            args: " --target x86_64-apple-darwin"
            rust-targets: x86_64-apple-darwin
          - platform: ubuntu-22.04
            args: ""
            rust-targets: ""
          - platform: windows-latest
            args: ""
            rust-targets: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      # The release tag is derived from tauri.conf.json > version; a pushed tag
      # that disagrees would publish installers under the wrong version.
      - name: Check the tag matches the app version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          APP_VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          if [ "v$APP_VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match app version $APP_VERSION"
            exit 1
          fi

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
          key: ${{ matrix.platform }}-${{ matrix.rust-targets }}

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev patchelf libgtk-3-dev xdg-utils

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      # tauri-build needs the sidecar before any cargo build or test. The
      # Intel macOS job fetches both its target and the arm64 host binary.
      - name: Cache FFmpeg sidecar
        uses: actions/cache@v4
        with:
          path: src-tauri/binaries
          key: ffmpeg-${{ runner.os }}-${{ runner.arch }}-${{ matrix.rust-targets }}-${{ hashFiles('scripts/ffmpeg-manifest.json') }}

      - name: Fetch FFmpeg sidecar
        run: node scripts/fetch-ffmpeg.mjs ${{ matrix.rust-targets }}

      - name: Lint, type-check and unit-test the frontend
        run: |
          pnpm lint
          pnpm check
          pnpm test

      - name: Test the Rust backend
        run: cargo test --manifest-path src-tauri/Cargo.toml --release

      - name: Build installers
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # __VERSION__ is replaced with tauri.conf.json > version, so a manual
          # run (workflow_dispatch) can't create a release named after a branch.
          tagName: v__VERSION__
          releaseName: "sharpR v__VERSION__"
          releaseBody: |
            Download the installer for your system from the assets below.

            - **Windows:** the `_x64-setup.exe` installer. It is not code-signed yet: if SmartScreen appears, click **More info → Run anyway**.
            - **macOS:** `_aarch64.dmg` for Apple Silicon, `_x64.dmg` for Intel. Open the DMG and drag sharpR to Applications. The app is not notarized yet: on first launch open **System Settings → Privacy & Security** and click **Open Anyway** (or run `xattr -dr com.apple.quarantine /Applications/sharpR.app`).
            - **Linux:** the `.AppImage` runs on most distributions (`chmod +x` it first; it needs FUSE 2, `libfuse2` or `libfuse2t64`). On Debian/Ubuntu you can install the `.deb` with `sudo apt install ./sharpR_*_amd64.deb`.

            sharpR bundles FFmpeg (GPL-3.0-or-later), which it runs as a separate program for video compression. See `src-tauri/licenses/THIRD-PARTY-NOTICES.md` for versions and sources.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
