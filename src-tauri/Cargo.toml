[package]
name = "sharpr"
version = "0.1.0"
description = "sharpR - local image converter and cropper for the web"
authors = ["Borna Gadanec"]
edition = "2021"
rust-version = "1.85"

[lib]
# The `_lib` suffix keeps the lib name unique from the bin name (Windows issue, cargo#8519).
name = "sharpr_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Imaging
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif", "bmp", "tiff", "rayon"] }
imageproc = "0.27"
webp = "0.3"
ravif = { version = "0.13", default-features = false, features = ["threading"] }
rgb = "0.8"
imgref = "1"
jpeg-encoder = "0.7"
oxipng = { version = "10", default-features = false, features = ["parallel"] }

# Files / concurrency / misc
zip = { version = "8", default-features = false, features = ["deflate"] }
rayon = "1"
walkdir = "2"
base64 = "0.22"
thiserror = "2"

[features]
# rav1e x86_64 assembly; needs NASM on PATH at build time. Opt-in.
avif-asm = ["ravif/asm"]

# Codecs are unusable in unoptimized builds; optimize dependencies even in dev.
[profile.dev.package."*"]
opt-level = 2

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "unwind"
strip = true
